services:
  backend:
    image: minhdang21/mern-frontend:2.0
    container_name: mern-backend-hub
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: ${MONGODB_URI}
      PORT: 5000

  frontend:
    image: minhdang21/mern-frontend:2.0
    container_name: mern-frontend-hub
    ports:
      - "3000:80"
    depends_on:
      - backend